name: CI

on:
    pull_request: ~
    push:
        branches:
            - main

# Cancel runs that are superseded by a newer push to the same branch or pull request
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: read-all

jobs:
    build-tools:
        uses: 'terminal42/contao-build-tools/.github/workflows/build-tools.yml@main'

    tests:
        name: PHP ${{ matrix.php }}, Contao ${{ matrix.contao }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]
                # Latest release of each branch (5.3.0 itself cannot be installed any more)
                contao: [ '5.3.*', '5.7.*' ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, pdo_sqlite, zlib
                    coverage: none
                env:
                    COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Install the dependencies
                run: >
                    composer update --no-interaction --no-progress
                    --with 'contao/core-bundle:${{ matrix.contao }}'
                    --with 'contao/calendar-bundle:${{ matrix.contao }}'

            -   name: Run the tests
                run: composer run tests

    coverage:
        name: Test coverage
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, pdo_sqlite, zlib
                    coverage: pcov
                env:
                    COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Install the dependencies
                run: composer install --no-interaction --no-progress

            -   name: Measure the test coverage
                run: |
                    mkdir -p build
                    vendor/bin/phpunit --coverage-text --coverage-filter src --coverage-clover build/clover.xml | tee build/coverage.txt
                    {
                        echo '### Test coverage'
                        echo '```'
                        sed -n '/Code Coverage Report/,/^Cgoit/p' build/coverage.txt | grep -E 'Classes|Methods|Lines'
                        echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload the coverage report
                uses: actions/upload-artifact@v7
                with:
                    name: coverage
                    path: build/clover.xml
